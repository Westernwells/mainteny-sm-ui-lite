stages:
  - lint
  - test
  - build-project
  - build-images
  - deploy

variables:
  DOCKER_REGISTRY: 155174012160.dkr.ecr.eu-central-1.amazonaws.com
  DOCKER_DRIVER: overlay
  IMAGE_SUFFIX: ${CI_COMMIT_SHORT_SHA}-${CI_PIPELINE_ID}

.build-project: &build-template
  stage: build-project
  image: 155174012160.dkr.ecr.eu-central-1.amazonaws.com/sm-ui-gitlab-ci:iron
  dependencies:
    - lint-project
    - e2e-tests
    - component-tests
    - vitest
  script:
    - node -v
    - export NODE_OPTIONS='--max-old-space-size=4096'
    - yarn install --frozen-lockfile --cache-folder .yarn-cache
    - yarn prepare_env
    - yarn check-format
    - yarn check-types
    - yarn check-lint
    - yarn build:${ENV}
  artifacts:
    paths:
      - build/
      - Dockerfile
      - nginx.prod.conf
      - nginx.stage.conf

.build-images: &build-image-template
  stage: build-images
  variables:
    GIT_STRATEGY: none
  image:
    name: gcr.io/kaniko-project/executor:debug
    entrypoint: [""]
  before_script:
    - mkdir -p /kaniko/.docker
    - echo "{\"credsStore\":\"ecr-login\",\"credHelpers\":{\"$DOCKER_REGISTRY\":\"ecr-login\"}}" > /kaniko/.docker/config.json
  script:
    - >
      /kaniko/executor
      --cache=true
      --context $CI_PROJECT_DIR 
      --dockerfile Dockerfile 
      --destination ${DOCKER_REGISTRY}/sm-lite:${IMAGE_SUFFIX}-${IMAGE_ENV}
      --build-arg ENV=${ENV}

.deploy_project: &deploy-template
  stage: deploy
  allow_failure: false
  image: 155174012160.dkr.ecr.eu-central-1.amazonaws.com/sm-ui-gitlab-ci:iron
  before_script:
    - git clone https://gitlab-ci-token:${CI_JOB_TOKEN}@gitlab.com/mainteny/infra/sm-ui-lite-deployment
    - cd sm-ui-lite-deployment
    - npm ci
    - aws sts get-caller-identity
    - pulumi login s3://mainteny-pulumi-state
  variables:
    ENV: stage
    CACHE_PATH: /*
  script:
    - pulumi stack select "sm-ui-lite.${STACK}"
    - pulumi config set aws:region eu-central-1
    - echo "Deploying ${IMAGE_SUFFIX} on environment $STACK"
    - pulumi config set --path "mainteny:imageName" ${DOCKER_REGISTRY}/sm-lite:${IMAGE_SUFFIX}-${IMAGE_ENV}
    - pulumi config set mainteny:version ${CI_COMMIT_SHORT_SHA}_$(date '+%Y%m%d')
    - pulumi config set mainteny:deploymentTimeStamp "$(date)"
    - pulumi cancel
    - pulumi stack ls
    - pulumi up -y
    - aws cloudfront create-invalidation --distribution-id $(pulumi stack output cdnDistributionId) --paths "$CACHE_PATH"
    - >-
      curl -X POST
      --data-urlencode
      "payload={
      \"channel\": \"#release-notifications\",
      \"username\": \"ReleaseBot\",
      \"text\": \"*Service Manager UI Lite $STACK Release* :rocket:\n
      *Git commit Message*: $CI_COMMIT_MESSAGE\n
      *Git commit ID*: <https://gitlab.com/mainteny/applications/sm-ui-lite/-/commit/$CI_COMMIT_SHA|$CI_COMMIT_SHORT_SHA>
      \",
      \"icon_emoji\": \":rocket:\"
       }" $SLACK_WEBHOOK_URL
    - |
      if [ "$STACK" = "prod" ]; then
        URL="$REACT_APP_API_URL_PROD"
        APIKEY="$VERSIONS_API_KEY_PROD"
        TYPE="WEB_PROD"
      elif [ "$STACK" = "release" ]; then
        URL="$REACT_APP_API_URL_STAGE"
        APIKEY="$VERSIONS_API_KEY_STAGE"
        TYPE="WEB_RELEASE"
      else
        URL="$REACT_APP_API_URL_STAGE"
        APIKEY="$VERSIONS_API_KEY_STAGE"
        TYPE="WEB_STAGING"
      fi
      # Use Node.js to JSON.stringify the changelog for escaping special characters
      ESCAPED_CHANGELOG=$(node -p 'JSON.stringify(process.env.CI_COMMIT_MESSAGE || "fallback changelog")')
      curl --fail -X 'POST' \
        "$URL/api/versions?apikey=$APIKEY" \
        -H 'accept: application/json' \
        -H 'Content-Type: application/json' \
        -d "{
          \"type\": \"$TYPE\",
          \"value\": \"$CI_COMMIT_SHORT_SHA\",
          \"changelog\": $ESCAPED_CHANGELOG,
          \"releaseTime\": \"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"
        }"
  rules:
    - if: "$CI_MERGE_REQUEST_ID"
      when: never

cache:
  - &global_cache_node_mods
    key:
      files:
        - yarn.lock
    paths:
      - node_modules/
    policy: pull # prevent subsequent jobs from modifying cache

lint-project:
  stage: lint
  image: 155174012160.dkr.ecr.eu-central-1.amazonaws.com/sm-ui-gitlab-ci:iron
  cache:
    - <<: *global_cache_node_mods
      when: on_success
      policy: pull-push
  script:
    - yarn install --frozen-lockfile --cache-folder .yarn-cache
    - yarn check-all
  rules:
    - if: $CI_COMMIT_REF_NAME != 'main' && $CI_COMMIT_REF_NAME != 'develop' && $CI_MERGE_REQUEST_ID
    - when: never

vitest:
  stage: test
  image: 155174012160.dkr.ecr.eu-central-1.amazonaws.com/sm-ui-gitlab-ci:iron
  cache:
    - <<: *global_cache_node_mods
      when: on_success
      policy: pull-push
  script:
    - yarn install --frozen-lockfile --cache-folder .yarn-cache
    - yarn vitest run --coverage --reporter junit --output-file results/vitest-[hash].xml
  artifacts:
    when: always
    paths:
      - results/vitest-*.xml
    reports:
      junit: results/vitest-*.xml
  rules:
    - if: $CI_COMMIT_REF_NAME != 'main' && $CI_COMMIT_REF_NAME != 'develop' && $CI_MERGE_REQUEST_ID
    - when: never

component-tests:
  stage: test
  image: 155174012160.dkr.ecr.eu-central-1.amazonaws.com/sm-ui-gitlab-ci:iron
  variables:
    ENV: stage
    REACT_APP_BASE_URL: http://localhost:5173
    REACT_APP_API_URL: $REACT_APP_API_URL_STAGE
    REACT_APP_GOOGLE_MAPS_KEY: $REACT_APP_GOOGLE_MAPS_KEY_STAGE
    npm_config_cache: "$CI_PROJECT_DIR/.npm"
    CYPRESS_CACHE_FOLDER: "$CI_PROJECT_DIR/cache/Cypress"
  rules:
    - if: $CI_COMMIT_REF_NAME != 'main' && $CI_COMMIT_REF_NAME != 'develop' && $CI_MERGE_REQUEST_ID
    - when: never
  script:
    - yarn install --frozen-lockfile --cache-folder .yarn-cache
    - yarn start & # Start the application in the background
    - yarn cypress:install # Install Cypress binary
    - yarn cypress:component --reporter junit --reporter-options "mochaFile=results/component-[hash].xml,toConsole=true,testCaseSwitchClassnameAndName=true,testsuitesTitle=true,suiteTitleSeparatedBy='.'" # Run Cypress tests
  artifacts:
    when: always
    paths:
      - results/component-*.xml
    reports:
      junit: results/component-*.xml

e2e-tests:
  stage: test
  image: 155174012160.dkr.ecr.eu-central-1.amazonaws.com/sm-ui-gitlab-ci:iron
  parallel: 6
  variables:
    ENV: stage
    REACT_APP_BASE_URL: http://localhost:5173
    REACT_APP_API_URL: $REACT_APP_API_URL_STAGE
    REACT_APP_GOOGLE_MAPS_KEY: $REACT_APP_GOOGLE_MAPS_KEY_STAGE
    npm_config_cache: "$CI_PROJECT_DIR/.npm"
    CYPRESS_CACHE_FOLDER: "$CI_PROJECT_DIR/cache/Cypress"
  rules:
    - if: $CI_COMMIT_REF_NAME != 'main' && $CI_COMMIT_REF_NAME != 'develop' && $CI_MERGE_REQUEST_ID
    - when: never
  script:
    - yarn install --frozen-lockfile --cache-folder .yarn-cache
    - yarn start & # Start the application in the background
    - yarn cypress:install # Install Cypress binary
    - yarn cypress:split-e2e --reporter junit --reporter-options "mochaFile=results/e2e-[hash].xml,toConsole=true,testCaseSwitchClassnameAndName=true,testsuitesTitle=true,suiteTitleSeparatedBy='.'" # Run Cypress tests
  artifacts:
    when: always
    paths:
      - results/e2e-*.xml
      - cypress/screenshots/**/*.png
    reports:
      junit: results/e2e-*.xml

build-feature-branch:
  <<: *build-template
  variables:
    ENV: stage
  rules:
    - if: $CI_COMMIT_REF_NAME != 'main' && $CI_COMMIT_REF_NAME != 'develop' && $CI_MERGE_REQUEST_ID
    - when: never

build-stage:
  <<: *build-template
  variables:
    ENV: stage
  rules:
    - if: $CI_COMMIT_REF_NAME == 'develop'
    - when: never

build-release:
  <<: *build-template
  variables:
    ENV: stage
  rules:
    - if: $CI_COMMIT_REF_NAME == 'main'
    - when: never

build-prod:
  <<: *build-template
  variables:
    ENV: prod
  rules:
    - if: $CI_COMMIT_REF_NAME == 'main'
    - when: never

build-stage-image:
  <<: *build-image-template
  dependencies:
    - build-stage
  rules:
    - if: $CI_COMMIT_REF_NAME == 'develop'
      when: on_success
      variables:
        ENV: stage
        IMAGE_ENV: stage
    - when: never

build-release-image:
  <<: *build-image-template
  dependencies:
    - build-release
  rules:
    - if: $CI_COMMIT_REF_NAME == 'main'
      when: on_success
      variables:
        ENV: stage
        IMAGE_ENV: release
    - when: never

build-prod-image:
  <<: *build-image-template
  dependencies:
    - build-prod
  rules:
    - if: $CI_COMMIT_REF_NAME == 'main'
      when: on_success
      variables:
        ENV: prod
        IMAGE_ENV: prod
    - when: never

deploy-stage:
  <<: *deploy-template
  dependencies:
    - build-stage-image
  rules:
    - if: "$CI_COMMIT_REF_NAME == 'develop'"
      variables:
        ENV: stage
        STACK: stage
        IMAGE_ENV: stage
        CACHE_PATH: /*
      when: on_success
    - when: never

deploy-release:
  <<: *deploy-template
  dependencies:
    - build-stage-image
  rules:
    - if: "$CI_COMMIT_REF_NAME == 'main'"
      variables:
        ENV: stage
        STACK: release
        IMAGE_ENV: release
        CACHE_PATH: /*
      when: on_success
    - when: never

deploy-production:
  <<: *deploy-template
  dependencies:
    - build-prod-image
  rules:
    - if: "$CI_COMMIT_REF_NAME == 'main'"
      variables:
        ENV: prod
        STACK: prod
        IMAGE_ENV: prod
        CACHE_PATH: /*
      when: manual
    - when: never
