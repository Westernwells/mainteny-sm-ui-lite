stages:
  - lint
  - test
  - build-project
  - build-images
  - deploy

variables:
  DOCKER_REGISTRY: 155174012160.dkr.ecr.eu-central-1.amazonaws.com
  DOCKER_DRIVER: overlay
  IMAGE_SUFFIX: ${CI_COMMIT_SHORT_SHA}-${CI_PIPELINE_ID}

.build-project: &build-template
  stage: build-project
  image: 155174012160.dkr.ecr.eu-central-1.amazonaws.com/sm-ui-gitlab-ci:iron
  image: 155174012160.dkr.ecr.eu-central-1.amazonaws.com/sm-ui-gitlab-ci:iron
  dependencies:
    - lint-project
    - tests
  cache:
    - key:
        files:
          - yarn.lock
      paths:
        - .yarn-cache/
  script:
    - node -v
    - export NODE_OPTIONS='--max-old-space-size=4096'
    - yarn install --frozen-lockfile --cache-folder .yarn-cache
    - yarn prepare_env
    - yarn check-format
    - yarn check-types
    - yarn check-lint
    - yarn build:${ENV}
  artifacts:
    paths:
      - build/
      - Dockerfile
      - nginx.prod.conf
      - nginx.stage.conf

.build-images: &build-image-template
  stage: build-images
  variables:
    GIT_STRATEGY: none
  image:
    name: gcr.io/kaniko-project/executor:debug
    entrypoint: [""]
  before_script:
    - mkdir -p /kaniko/.docker
    - echo "{\"credsStore\":\"ecr-login\",\"credHelpers\":{\"$DOCKER_REGISTRY\":\"ecr-login\"}}" > /kaniko/.docker/config.json
  script:
    - >
      /kaniko/executor
      --cache=true
      --context $CI_PROJECT_DIR 
      --dockerfile Dockerfile 
      --destination ${DOCKER_REGISTRY}/sm-lite:${IMAGE_SUFFIX}-${IMAGE_ENV}
      --build-arg ENV=${ENV}

.deploy_project: &deploy-template
  stage: deploy
  allow_failure: false
  image: 155174012160.dkr.ecr.eu-central-1.amazonaws.com/sm-ui-gitlab-ci:iron
  image: 155174012160.dkr.ecr.eu-central-1.amazonaws.com/sm-ui-gitlab-ci:iron
  before_script:
    - git clone https://gitlab-ci-token:${CI_JOB_TOKEN}@gitlab.com/mainteny/infra/sm-ui-lite-deployment
    - cd sm-ui-lite-deployment
    - npm ci
    - aws sts get-caller-identity
    - pulumi login s3://mainteny-pulumi-state
  variables:
    ENV: stage
    CACHE_PATH: /*
  script:
    - pulumi stack select "sm-ui-lite.${STACK}"
    - pulumi config set aws:region eu-central-1
    - echo "Deploying ${IMAGE_SUFFIX} on environment $STACK"
    - pulumi config set --path "mainteny:imageName" ${DOCKER_REGISTRY}/sm-lite:${IMAGE_SUFFIX}-${IMAGE_ENV}
    - pulumi config set mainteny:version ${CI_COMMIT_SHORT_SHA}_$(date '+%Y%m%d')
    - pulumi config set mainteny:deploymentTimeStamp "$(date)"
    - pulumi up -y
    - aws cloudfront create-invalidation --distribution-id $(pulumi stack output cdnDistributionId) --paths "$CACHE_PATH"
    - >-
      curl -X POST
      --data-urlencode
      "payload={
      \"channel\": \"#release-notifications\",
      \"username\": \"ReleaseBot\",
      \"text\": \"*Service Manager UI Lite $STACK Release* :rocket:\n
      *Git commit Message*: $CI_COMMIT_MESSAGE\n
      *Git commit ID*: <https://gitlab.com/mainteny/applications/sm-ui-lite/-/commit/$CI_COMMIT_SHA|$CI_COMMIT_SHORT_SHA>
      \",
      \"icon_emoji\": \":rocket:\"
       }" $SLACK_WEBHOOK_URL
  rules:
    - if: "$CI_MERGE_REQUEST_ID"
      when: never

lint-project:
  stage: lint
  image: 155174012160.dkr.ecr.eu-central-1.amazonaws.com/sm-ui-gitlab-ci:iron
  image: 155174012160.dkr.ecr.eu-central-1.amazonaws.com/sm-ui-gitlab-ci:iron
  cache:
    - key:
        files:
          - yarn.lock
      paths:
        - .yarn-cache/
  script:
    - yarn install --frozen-lockfile --cache-folder .yarn-cache
    - yarn check-all
  rules:
    - if: $CI_COMMIT_REF_NAME != 'main' && $CI_COMMIT_REF_NAME != 'develop' && $CI_MERGE_REQUEST_ID
    - when: never
  rules:
    - if: $CI_COMMIT_REF_NAME != 'main' && $CI_COMMIT_REF_NAME != 'develop' && $CI_MERGE_REQUEST_ID
    - when: never


tests:
  stage: test
  image: 155174012160.dkr.ecr.eu-central-1.amazonaws.com/sm-ui-gitlab-ci:iron
  image: 155174012160.dkr.ecr.eu-central-1.amazonaws.com/sm-ui-gitlab-ci:iron
  cache:
    - key:
        files:
          - yarn.lock
      paths:
        - .yarn-cache/
  variables:
    ENV: stage
    REACT_APP_BASE_URL: http://localhost:5173
    REACT_APP_API_URL: $REACT_APP_API_URL_STAGE
    REACT_APP_MIXPANEL_TOKEN: $REACT_APP_MIXPANEL_TOKEN_STAGE
    REACT_APP_GOOGLE_MAPS_KEY: $REACT_APP_GOOGLE_MAPS_KEY_STAGE
  script:
    - yarn install --cache-folder .yarn-cache
    - yarn start & # Start the application in the background
    - yarn cypress:run # Run Cypress tests
  rules:
    - if: $CI_COMMIT_REF_NAME != 'main' && $CI_COMMIT_REF_NAME != 'develop' && $CI_MERGE_REQUEST_ID
    - when: never

build-feature-branch:
  <<: *build-template
  variables:
    ENV: stage
  rules:
    - if: $CI_COMMIT_REF_NAME != 'main' && $CI_COMMIT_REF_NAME != 'develop' && $CI_MERGE_REQUEST_ID
    - when: never

build-stage:
  <<: *build-template
  variables:
    ENV: stage
  rules:
    - if: $CI_COMMIT_REF_NAME == 'develop'
    - when: never

build-release:
  <<: *build-template
  variables:
    ENV: stage
  rules:
    - if: $CI_COMMIT_REF_NAME == 'main'
    - when: never

build-prod:
  <<: *build-template
  variables:
    ENV: prod
  rules:
    - if: $CI_COMMIT_REF_NAME == 'main'
    - when: never

build-stage-image:
  <<: *build-image-template
  dependencies:
    - build-stage
  rules:
    - if: $CI_COMMIT_REF_NAME == 'develop'
      when: on_success
      variables:
        ENV: stage
        IMAGE_ENV: stage
    - when: never

build-release-image:
  <<: *build-image-template
  dependencies:
    - build-release
  rules:
    - if: $CI_COMMIT_REF_NAME == 'main'
      when: on_success
      variables:
        ENV: stage
        IMAGE_ENV: release
    - when: never

build-prod-image:
  <<: *build-image-template
  dependencies:
    - build-prod
  rules:
    - if: $CI_COMMIT_REF_NAME == 'main'
      when: on_success
      variables:
        ENV: prod
        IMAGE_ENV: prod
    - when: never

deploy-stage:
  <<: *deploy-template
  dependencies:
    - build-stage-image
  rules:
    - if: "$CI_COMMIT_REF_NAME == 'develop'"
      variables:
        ENV: stage
        STACK: stage
        IMAGE_ENV: stage
        CACHE_PATH: /*
      when: on_success
    - when: never

deploy-release:
  <<: *deploy-template
  dependencies:
    - build-stage-image
  rules:
    - if: "$CI_COMMIT_REF_NAME == 'main'"
      variables:
        ENV: stage
        STACK: release
        IMAGE_ENV: release
        CACHE_PATH: /*
      when: on_success
    - when: never

deploy-production:
  <<: *deploy-template
  dependencies:
    - build-prod-image
  rules:
    - if: "$CI_COMMIT_REF_NAME == 'main'"
      variables:
        ENV: prod
        STACK: prod
        IMAGE_ENV: prod
        CACHE_PATH: /*
      when: manual
    - when: never
