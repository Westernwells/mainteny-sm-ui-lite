stages:
  - lint
  - playwright-tests
  - test
  - build-project
  - deploy

variables:
  DOCKER_REGISTRY: 155174012160.dkr.ecr.eu-central-1.amazonaws.com
  DOCKER_DRIVER: overlay
  IMAGE_SUFFIX: ${CI_COMMIT_SHORT_SHA}-${CI_PIPELINE_ID}

.build-project: &build-template
  stage: build-project
  image: 155174012160.dkr.ecr.eu-central-1.amazonaws.com/sm-ui-gitlab-ci:iron
  dependencies:
    - lint-project
    - playwright-tests
    - vitest
  script:
    - node -v
    - export NODE_OPTIONS='--max-old-space-size=4096'
    - yarn install --frozen-lockfile --cache-folder .yarn-cache
    - yarn prepare_env
    - yarn build:${ENV}
  artifacts:
    paths:
      - build/

.deploy_project: &deploy-template
  stage: deploy
  allow_failure: false
  image: 155174012160.dkr.ecr.eu-central-1.amazonaws.com/sm-ui-gitlab-ci:iron
  variables:
    ENV: stage
    CACHE_PATH: /*
    DISTRIBUTION_ID: E24VZD1QKFHU18
  script:
    - echo "Deploying environment ${ENV}"
    - DATE=$(date +"%Y_%m_%d")
    - aws s3 cp ./build/ s3://mainteny-deployments/sm/${ENV}/current/ --recursive
    - aws s3 cp ./build/ s3://mainteny-deployments/sm/${ENV}/${DATE}_${CI_COMMIT_SHORT_SHA}/ --recursive
    - aws cloudfront create-invalidation --distribution-id ${DISTRIBUTION_ID} --paths "$CACHE_PATH"
    - >-
      curl -X POST
      --data-urlencode
      "payload={
      \"channel\": \"#release-notifications\",
      \"username\": \"ReleaseBot\",
      \"text\": \"*Service Manager UI Lite $STACK Release* :rocket:\n
      *Git commit Message*: $CI_COMMIT_MESSAGE\n
      *Git commit ID*: <https://gitlab.com/mainteny/applications/sm-ui-lite/-/commit/$CI_COMMIT_SHA|$CI_COMMIT_SHORT_SHA>
      \",
      \"icon_emoji\": \":rocket:\"
       }" $SLACK_WEBHOOK_URL
    - |
      if [ "$STACK" = "prod" ]; then
        URL="$REACT_APP_API_URL_PROD"
        APIKEY="$VERSIONS_API_KEY_PROD"
        TYPE="WEB_PROD"
      elif [ "$STACK" = "release" ]; then
        URL="$REACT_APP_API_URL_STAGE"
        APIKEY="$VERSIONS_API_KEY_STAGE"
        TYPE="WEB_RELEASE"
      else
        URL="$REACT_APP_API_URL_STAGE"
        APIKEY="$VERSIONS_API_KEY_STAGE"
        TYPE="WEB_STAGING"
      fi
      # Use Node.js to JSON.stringify the changelog for escaping special characters
      ESCAPED_CHANGELOG=$(node -p 'JSON.stringify(process.env.CI_COMMIT_MESSAGE || "fallback changelog")')
      curl --fail -X 'POST' \
        "$URL/api/versions?apikey=$APIKEY" \
        -H 'accept: application/json' \
        -H 'Content-Type: application/json' \
        -d "{
          \"type\": \"$TYPE\",
          \"value\": \"$CI_COMMIT_SHORT_SHA\",
          \"changelog\": $ESCAPED_CHANGELOG,
          \"releaseTime\": \"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"
        }"
  rules:
    - if: "$CI_MERGE_REQUEST_ID"
      when: never

cache:
  - &global_cache_node_mods
    key:
      files:
        - yarn.lock
    paths:
      - node_modules/
    policy: pull # prevent subsequent jobs from modifying cache

lint-project:
  stage: lint
  image: 155174012160.dkr.ecr.eu-central-1.amazonaws.com/sm-ui-gitlab-ci:iron
  cache:
    - <<: *global_cache_node_mods
      when: on_success
      policy: pull-push
  script:
    - yarn install --frozen-lockfile --cache-folder .yarn-cache
    - yarn check-all
  rules:
    - if: $CI_COMMIT_REF_NAME != 'main' && $CI_COMMIT_REF_NAME != 'develop' && $CI_MERGE_REQUEST_ID
    - when: never

playwright-tests:
  stage: playwright-tests
  image: 155174012160.dkr.ecr.eu-central-1.amazonaws.com/sm-ui-gitlab-ci:iron
  parallel: 6
  timeout: 2h
  dependencies:
    - lint-project
  variables:
    ENV: stage
    REACT_APP_BASE_URL: http://localhost:5173
    REACT_APP_API_URL: $REACT_APP_API_URL_STAGE
    REACT_APP_GOOGLE_MAPS_KEY: $REACT_APP_GOOGLE_MAPS_KEY_STAGE
    PERCY_TOKEN: $PERCY_TOKEN
  cache:
    - <<: *global_cache_node_mods
      when: on_success
      policy: pull
  rules:
    - if: $CI_COMMIT_REF_NAME != 'main' && $CI_COMMIT_REF_NAME != 'develop' && $CI_MERGE_REQUEST_ID
    - when: never
  script:
    - yarn install --frozen-lockfile --cache-folder .yarn-cache
    - yarn start & # Start the application in the background
    - sleep 30 # Wait for the application to start
    - yarn playwright:install # Install Playwright chromium browser
    - |
      # Debug parallel job information
      echo "Parallel job info - CI_NODE_INDEX: $CI_NODE_INDEX, CI_NODE_TOTAL: $CI_NODE_TOTAL"
      
      # Run Percy tests only on the first parallel job (CI_NODE_INDEX=1 for GitLab)
      if [ "$CI_NODE_INDEX" = "1" ]; then
        yarn percy:test &
        PERCY_PID=$!
      fi
      
      # Run Playwright tests split across parallel jobs (CI_NODE_INDEX is 1-based in GitLab)
      echo "Running Playwright tests with shard: $CI_NODE_INDEX/$CI_NODE_TOTAL"
      yarn playwright:test --shard=$CI_NODE_INDEX/$CI_NODE_TOTAL &
      PLAYWRIGHT_PID=$!
      
      # Wait for processes and capture exit codes
      if [ "$CI_NODE_INDEX" = "1" ]; then
        wait $PERCY_PID
        PERCY_EXIT=$?
      else
        PERCY_EXIT=0
      fi
      
      wait $PLAYWRIGHT_PID
      PLAYWRIGHT_EXIT=$?
      
      # Fail if either test suite failed
      if [ $PERCY_EXIT -ne 0 ] || [ $PLAYWRIGHT_EXIT -ne 0 ]; then
        echo "Tests failed - Percy exit code: $PERCY_EXIT, Playwright exit code: $PLAYWRIGHT_EXIT"
        exit 1
      fi
      
      echo "All tests passed successfully"
  artifacts:
    when: always
    paths:
      - results/playwright-results.xml
      - playwright-report/
      - test-results/
    reports:
      junit: results/playwright-results.xml

vitest:
  stage: test
  image: 155174012160.dkr.ecr.eu-central-1.amazonaws.com/sm-ui-gitlab-ci:iron
  cache:
    - <<: *global_cache_node_mods
      when: on_success
      policy: pull-push
  script:
    - yarn install --frozen-lockfile --cache-folder .yarn-cache
    - yarn vitest run --coverage --reporter junit --output-file results/vitest-[hash].xml
  artifacts:
    when: always
    paths:
      - results/vitest-*.xml
    reports:
      junit: results/vitest-*.xml
  rules:
    - if: $CI_COMMIT_REF_NAME != 'main' && $CI_COMMIT_REF_NAME != 'develop' && $CI_MERGE_REQUEST_ID
    - when: never

build-feature-branch:
  <<: *build-template
  variables:
    ENV: stage
  rules:
    - if: $CI_COMMIT_REF_NAME != 'main' && $CI_COMMIT_REF_NAME != 'develop' && $CI_MERGE_REQUEST_ID
    - when: never

build-stage:
  <<: *build-template
  variables:
    ENV: stage
  rules:
    - if: $CI_COMMIT_REF_NAME == 'develop'
    - when: never

build-release:
  <<: *build-template
  variables:
    ENV: stage
  rules:
    - if: $CI_COMMIT_REF_NAME == 'main'
    - when: never

build-prod:
  <<: *build-template
  variables:
    ENV: prod
  rules:
    - if: $CI_COMMIT_REF_NAME == 'main'
    - when: never


deploy-stage:
  <<: *deploy-template
  dependencies:
    - build-stage
  rules:
    - if: "$CI_COMMIT_REF_NAME == 'develop'"
      variables:
        ENV: stage
        STACK: stage
        IMAGE_ENV: stage
        CACHE_PATH: /*
        DISTRIBUTION_ID: E24VZD1QKFHU18
      when: on_success
    - when: never

deploy-release:
  <<: *deploy-template
  dependencies:
    - build-release
  rules:
    - if: "$CI_COMMIT_REF_NAME == 'main'"
      variables:
        ENV: release
        STACK: release
        IMAGE_ENV: release
        CACHE_PATH: /*
        DISTRIBUTION_ID: E3F5LYXHAYQH8G
      when: on_success
    - when: never

deploy-production:
  <<: *deploy-template
  dependencies:
    - build-prod
  rules:
    - if: "$CI_COMMIT_REF_NAME == 'main'"
      variables:
        ENV: prod
        STACK: prod
        IMAGE_ENV: prod
        CACHE_PATH: /*
        DISTRIBUTION_ID: E25UK9TDV510UC
      when: manual
    - when: never
